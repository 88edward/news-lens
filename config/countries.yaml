# config/countries.yaml
#
# ★ FIPS vs ISO 함정 ★
# GDELT의 sourcecountry 필터는 ISO 3166-1 이 아니라 FIPS 10-4 코드를 쓴다.
#   한국  ISO=KR / FIPS=KS
#   중국  ISO=CN / FIPS=CH   (ISO에서 CH는 스위스다)
#   일본  ISO=JP / FIPS=JA
#   독일  ISO=DE / FIPS=GM
#   영국  ISO=GB / FIPS=UK
#   호주  ISO=AU / FIPS=AS   (FIPS에서 AU는 오스트리아다)
# 이 매핑을 경유하지 않으면 조용히 엉뚱한 나라 기사를 모은다.
#
# 코드는 반드시 따옴표로 감싼다 — YAML 1.1 은 따옴표 없는 NO(노르웨이)를
# boolean False 로 읽는다. config 로더가 이걸 잡아내지만 애초에 만들지 마라.
#
# name_en 은 GDELT timelinesourcecountry 응답의 시리즈 이름과 맞추기 위한 것이다.
# lat/lng 는 글로브 마커용 국가 중심 좌표다.

