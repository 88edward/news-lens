# config/pipeline.yaml — 임계값·상한·보관 기간. 코드에 숫자를 박지 않기 위한 파일.

cost:
  max_daily_cost_usd: 1.20       # 월 $36 상한. 넘으면 코드가 중단시킨다.
  warn_at_fraction: 0.7          # 70% 넘으면 stderr 경고

filter:
  languages: [en]                # 룰 필터가 통과시킬 언어
  min_title_chars: 20
  min_lead_chars: 80
  domain_blocklist:
    - example-spam.com
  domain_allowlist: []           # 비어 있으면 블록리스트만 적용

embed:
  dimensions: 768          # models.yaml 의 dimensions 와 맞춘다
  quantize: int8
  batch_size: 100          # Gemini embed_content 한 번에 보내는 개수
  text_fields: [title, lead]     # 본문 전체를 넣지 않는다

cluster:
  min_cluster_size: 2
  min_samples: 1
  cluster_selection_epsilon: 0.12
  similarity_threshold: 0.82     # 코사인 유사도 하한
  max_representatives: 3         # 사건당 대표 기사 수
  representative_one_per_domain: true

batch:
  poll_exit_code_pending: 75     # step6이 PENDING일 때 쓰는 exit code
  max_wait_hours: 24             # Batch API 보장 상한
  max_requests_per_batch: 1000

retention:
  # DB 를 레포에 커밋하므로 크기를 직접 관리해야 한다. step9_prune 이 쓴다.
  raw_blob_days: 90              # data/raw/ 의 원문 gzip. step9_prune 이 지운다
  static_build_days: 30          # 이 기간만 정적으로 굽는다
  weights_history_days: 365
  article_days: 14               # 기사 원본 행은 이만큼만 남긴다
  filter_log_days: 14
  analysis_days: 60              # 사건 분석 JSON 전문을 남기는 기간
                                 # (지나면 헤드라인·논조만 남기고 비운다.
                                 #  전문은 이미 정적 페이지에 구워져 있다)
  drop_embeddings_after_cluster: true   # 클러스터링 뒤 벡터는 쓸 데가 없다

site:
  base_url: "https://news-lens.pages.dev"
  timezone: "Asia/Seoul"
  deploy:
    # Cloudflare Pages 프로젝트 이름. wrangler --project-name 에 그대로 쓴다.
    project_name: news-lens
    production_branch: main
    # 프리뷰 배포의 기본 브랜치 이름. 프로덕션 URL 을 건드리지 않는다.
    preview_branch: preview
    # 빌드 산출물에 이 문자열이 있으면 샘플 데이터다 → 프로덕션 배포를 막는다.
    sample_markers:
      - example-news-
      - 오프라인 표본 응답

  globe:
    ring_surge_threshold: 1.8
    max_rings: 3
    max_labels: 12
    top_countries: 25
