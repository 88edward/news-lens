name: 실패 보고
description: 크론 실패를 GitHub 이슈로 올린다. 같은 날 같은 단계면 댓글로 잇는다.

# 크론은 조용히 죽는다. 알림이 없으면 몇 주 뒤에야 안다.
# 세 워크플로가 같은 동작을 해야 하는데 GitHub Actions 는 YAML 앵커를
# 지원하지 않으므로(복붙하면 세 곳이 서서히 어긋난다) composite action 으로 뺀다.

inputs:
  stage:
    description: '실패한 단계 이름 (weights / collect / submit / publish)'
    required: true
  note:
    description: '이슈 본문에 덧붙일 설명'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      with:
        script: |
          const stage = process.env.STAGE;
          const note = process.env.NOTE || '';
          const today = new Date().toISOString().slice(0, 10);
          const title = `${stage} 실패 — ${today}`;
          const runUrl =
            `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
            `/actions/runs/${context.runId}`;

          const body = [
            `**${stage}** 단계가 실패했다.`,
            '',
            `실행 로그: ${runUrl}`,
            `워크플로: ${context.workflow}`,
            '',
            note,
          ].join('\n');

          // 같은 날 같은 단계로 이슈가 이미 열려 있으면 댓글로 잇는다.
          // 크론이 6시간마다 도는데 매번 새 이슈를 만들면 알림이 무의미해진다.
          const open = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'cron-failure',
            per_page: 100,
          });
          const dup = open.data.find((issue) => issue.title === title);

          if (dup) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: dup.number,
              body,
            });
            core.info(`기존 이슈 #${dup.number} 에 댓글을 달았다`);
          } else {
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['cron-failure', stage],
            });
            core.info(`이슈 #${created.data.number} 를 만들었다`);
          }
      env:
        STAGE: ${{ inputs.stage }}
        NOTE: ${{ inputs.note }}
