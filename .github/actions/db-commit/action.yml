name: DB 커밋
description: SQLite 를 SQL 덤프로 내보내 레포에 커밋한다.

# 러너는 실행이 끝나면 사라진다. 여기서 남기지 않으면 다음 크론이
# 빈 DB로 시작한다 — step1 이 모은 기사가 step2 에는 없다.

inputs:
  message:
    description: '커밋 메시지에 붙일 단계 이름'
    required: true

runs:
  using: composite
  steps:
    - name: 덤프 내보내기
      shell: bash
      run: |
        python -m store.dump export
        python -m store.dump size

    - name: 커밋과 푸시
      shell: bash
      run: |
        set -e
        git config user.name  "news-lens bot"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        BRANCH="${GITHUB_REF_NAME}"

        git add data/news-lens.sql
        if git diff --cached --quiet; then
          echo "DB 변화 없음 — 커밋하지 않는다"
          exit 0
        fi
        git commit -m "data: ${{ inputs.message }} ($(date -u '+%Y-%m-%d %H:%M UTC'))"

        # concurrency 그룹이 세 워크플로를 직렬화하므로 충돌은 드물다.
        # 그래도 사람이 그 사이에 푸시할 수 있다.
        #
        # rebase 를 쓰지 않는다: 덤프는 생성 파일이라 줄 단위 충돌이 나면
        # 자동으로 풀 방법이 없다. 대신 원격 위로 HEAD 만 옮기고(--soft)
        # 이 실행이 만든 덤프를 그대로 다시 얹는다. 충돌이 일어날 수 없고,
        # 원격의 다른 커밋(코드 변경 등)도 보존된다.
        for attempt in 1 2 3; do
          if git push origin "HEAD:${BRANCH}"; then
            echo "푸시 성공 (시도 $attempt)"
            exit 0
          fi
          echo "원격이 앞서 있다 — 그 위에 다시 얹는다 ($attempt/3)"
          git fetch origin "$BRANCH"
          git reset --soft "origin/${BRANCH}"
          git add data/news-lens.sql
          if git diff --cached --quiet; then
            echo "원격 덤프가 이미 같다 — 끝낸다"
            exit 0
          fi
          git commit -m "data: ${{ inputs.message }} (재시도 $attempt)"
          sleep $((attempt * 5))
        done

        echo "::error::DB 푸시에 3회 실패했다. 다음 실행이 오래된 DB로 시작한다."
        exit 1
